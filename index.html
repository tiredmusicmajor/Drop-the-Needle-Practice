<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <title>YouTube Playlist Guessing Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 30px auto;
        padding: 0 20px;
        text-align: center;
    }

    input {
        width: 90%;
        padding: 10px;
        margin: 8px;
        font-size: 16px;
    }

    button {
        padding: 10px 18px;
        margin: 8px;
        font-size: 16px;
        cursor: pointer;
    }

    #player-wrapper {
        position: relative;
        width: 560px;
        max-width: 100%;
        margin: 20px auto;
        aspect-ratio: 16 / 9;
        background: black;
    }

    #player {
        width: 100%;
        height: 100%;
    }

    #video-cover {
        position: absolute;
        inset: 0;
        background: black;
        z-index: 2;
    }

    #game {
        display: none;
    }

    #answer {
        margin: 20px;
        font-weight: bold;
        font-size: 18px;
    }
</style>

<script src="https://www.youtube.com/iframe_api"></script>
```

</head>

<body>

<h1>YouTube Playlist Guessing Game</h1>

<div id="setup">
    <p>
        Enter a public or unlisted YouTube playlist and your own YouTube Data API key.
    </p>

```
<input id="playlistUrl" placeholder="YouTube playlist URL">
<br>

<input id="apiKey" placeholder="YouTube API key">
<br>

<button onclick="initializeGame()">Start Game</button>
```

</div>

<div id="game">

```
<div id="player-wrapper">
    <div id="player"></div>
    <div id="video-cover"></div>
</div>


<button onclick="toggleAudio()">
    Play / Pause Audio
</button>

<br>

<input id="guess" placeholder="Composer and title guess">

<br>

<button onclick="revealAnswer()">
    Reveal Answer
</button>

<div id="answer"></div>

<button onclick="nextSong()">
    Next Song
</button>
```

</div>

<script src="app.js"></script>

</body>
</html>
